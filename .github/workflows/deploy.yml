name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, and let a newer push cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

# Nothing by default; each job is granted only what it needs. The build job in
# particular must NOT hold pages:write — it runs `npm ci` and a network-fetching
# prebuild script, so a malicious lifecycle script in any of ~230 dependencies
# would otherwise be able to publish to the site or mint an OIDC token.
#
# Actions are pinned by commit SHA for the same reason a lockfile pins packages
# by hash: a tag is mutable, and the deploy job is the one place in this repo
# holding rights to publish. Dependabot keeps the pins current
# (.github/dependabot.yml), so pinning does not decay into running stale code.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Nothing in this job pushes, so the token has no reason to sit in
      # .git/config while `npm ci` runs dependency lifecycle scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The tests are the guard on the geometry that every exported photo
      # depends on. A broken crop must never reach Pages.
      - run: npm test
      - run: npm run typecheck

      # Must precede the build, because it supplies the base path the build
      # needs. Deriving that by hand as /<repo>/ is correct only while the site
      # has no custom domain: add one and Pages serves from the root, so every
      # hand-derived asset URL 404s while the build still reports success.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        # base_path arrives without a trailing slash — "/my-repo", or "" for a
        # custom domain — and Vite's base wants one, so it is appended here.
        # That also maps the custom-domain case to "/" rather than "", which
        # Vite would otherwise interpret as a relative base.
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      # A code review of src/ cannot see a beacon that lives inside a
      # dependency, so the shipped bytes are checked directly.
      - name: Assert no telemetry host in the build
        run: |
          # Without this, a missing dist/ makes grep exit 2, the `if` not fire,
          # and the gate report success having inspected nothing.
          if [ ! -d dist ]; then
            echo "::error::dist/ does not exist, so nothing was checked. Refusing to deploy."
            exit 1
          fi
          if grep -rl "odml.pa.googleapis.com" dist/; then
            echo "::error::Telemetry host found in dist/. Refusing to deploy."
            exit 1
          fi
          echo "No telemetry host in dist/."

      # upload-pages-artifact v4 stopped including dotfiles in the artifact.
      # Safe here: the Vite build emits none, and this site needs no .nojekyll
      # because the Pages Actions flow never runs Jekyll.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
