version: 2

# The deploy workflow pins its actions by commit SHA, which is only safe if
# something keeps the pins moving — an unattended pin is just a stale
# dependency with better provenance. Dependabot rewrites both the SHA and its
# trailing version comment, so the pins stay readable as it updates them.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
